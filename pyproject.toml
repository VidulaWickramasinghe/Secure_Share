[project]
name = "secure-share"
version = "0.1.0"
description = "Private, owner-controlled file transfer with Flask"
readme = "README.md"
requires-python = ">=3.12"
# Keep these constraints in sync with requirements.txt (checked by pytest).
dependencies = [
    "Flask>=3.1.3,<4",
    "Flask-Limiter[redis]>=4.1.1,<5",
    "Flask-Migrate>=4.1.0,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "Werkzeug>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.3.4,<4",
    "vercel>=0.10.0,<0.11",
    "httpx>=0.28.1,<1",
]

[tool.uv]
# Vercel bundles this application directly; it is not an installable library.
package = false

[tool.vercel]
entrypoint = "run:app"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.bandit]
exclude_dirs = [".venv", "migrations", "tests"]
