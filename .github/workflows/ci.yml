name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run migration smoke tests
        run: python -m pytest -q tests/test_migrations.py

      - name: Run test suite
        run: python -m pytest

  vercel-dependencies:
    name: Vercel dependency installation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up deployment Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Vercel's uv version
        run: python -m pip install uv==0.10.11

      - name: Validate the deployment lockfile
        run: uv lock --check

      - name: Install only locked production dependencies
        run: uv sync --frozen --no-dev --no-editable

      - name: Check installed dependency compatibility
        run: uv pip check

      - name: Import the WSGI app in the clean deployment environment
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///:memory:"
          MAIL_BACKEND: memory
        run: |
          .venv/bin/python - <<'PY'
          from flask import Flask
          from run import app

          assert isinstance(app, Flask)
          client = app.test_client()
          assert client.get('/').status_code == 200
          assert client.get('/static/css/style.css').status_code == 200
          assert client.get('/api/files').status_code == 401
          PY

      - name: Verify incomplete Vercel setup is a safe 503 on a cold import
        env:
          VERCEL: "1"
          APP_ENV: "invalid"
          MAX_CONTENT_LENGTH: "invalid"
          PYTHON_DOTENV_DISABLED: "1"
        run: |
          .venv/bin/python - <<'PY'
          from run import app

          client = app.test_client()
          assert client.get('/').status_code == 503
          assert client.get('/healthz').status_code == 503
          assert client.post('/api/files').status_code == 503
          assert not app.extensions
          PY

      - name: Verify configured Vercel startup does not write to its bundle
        env:
          VERCEL: "1"
          APP_ENV: production
          DATABASE_URL: "postgresql+psycopg://database.example.invalid/secure_share"
          RATELIMIT_STORAGE_URI: "redis://redis.example.invalid:6379/0"
          PUBLIC_BASE_URL: "https://secure-share.example"
          SMTP_HOST: "smtp.example.invalid"
          PYTHON_DOTENV_DISABLED: "1"
        run: |
          .venv/bin/python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          from unittest.mock import patch

          for name in ('SECRET_KEY', 'ACCOUNT_TOKEN_PEPPER', 'RATE_LIMIT_KEY_SECRET',
                       'CRON_SECRET', 'BLOB_READ_WRITE_TOKEN'):
              os.environ[name] = secrets.token_urlsafe(48)
          with patch.object(Path, 'mkdir', side_effect=AssertionError('bundle write')):
              with patch.object(Path, 'chmod', side_effect=AssertionError('bundle write')):
                  from run import app
                  assert 'sqlalchemy' in app.extensions
                  client = app.test_client()
                  base = 'https://secure-share.example'
                  assert client.get('/', base_url=base).status_code == 200
                  assert client.get('/static/css/style.css', base_url=base).status_code == 200
                  assert client.get('/api/files', base_url=base).status_code == 401
                  assert client.post('/api/internal/email-worker', base_url=base).status_code == 401
          PY

  security:
    name: Static and dependency security checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting-independent Python issues
        run: python -m ruff check .

      - name: Run static security analysis
        run: python -m bandit -q -c pyproject.toml -r app deployment.py check_deployment.py run.py

      - name: Audit resolved runtime dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Detect newly introduced secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
